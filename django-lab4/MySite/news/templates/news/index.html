<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>

    {% for item in news %}
        <div>
            <p><strong>{{ item.title }}</strong></p>
            <p>{{ item.content }}</p>
            {% if item.category %}
                <p>Категория: {{ item.category.title }}</p>
            {% endif %}
            <p>{{ item.created_at|date:"Y-m-d H:i:s" }}</p>
        </div>
        <hr>
    {% empty %}
        <p>Новостей пока нет.</p>
    {% endfor %}
</body>
</html>
